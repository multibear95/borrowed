[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "borrowed-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "pydantic-settings>=2,<3", "uvicorn>=0.30,<1", "openai>=2,<3", "langgraph>=1,<2", "python-multipart>=0.0.18,<1", "mcp==1.26.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
borrowed-backend = "borrowed_backend.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
